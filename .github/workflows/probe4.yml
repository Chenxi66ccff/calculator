name: Probe4
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe4.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 p4a 源码中的 VERSION_ 覆盖逻辑与调用链
        run: |
          cat > /tmp/p.py <<'PYEOF'
import os, re, inspect
p = "/home/user/hostcwd/.buildozer/android/platform/python-for-android/pythonforandroid/build.py"
print("build.py 存在:", os.path.exists(p))
if os.path.exists(p):
    src = open(p, encoding="utf-8").read()
    i = src.find("VERSION_")
    print("VERSION_ 出现在偏移:", i)
    if i > 0:
        print("---- 上下文 ----")
        print(src[max(0, i-800):i+600])
    print("---- run_pymodules_install 是否定义 ----")
    print("def run_pymodules_install" in src)
PYEOF
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            -v /tmp/p.py:/tmp/p.py:ro \
            -e VERSION_charset-normalizer=3.4.4 \
            --entrypoint python3 \
            kivy/buildozer:latest /tmp/p.py
