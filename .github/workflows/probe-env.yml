name: Env probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-env.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe env var names
        run: |
          cat > /tmp/probe.py <<'PYEOF'
import os, sys
print("python:", sys.version.split()[0])
hits = sorted(k for k in os.environ if "VERSION" in k or "charset" in k.lower())
print("visible env vars:", hits)
for k in hits:
    print("  %r = %r" % (k, os.environ[k]))
print("hyphen lookup :", repr(os.environ.get("VERSION_charset-normalizer")))
print("underscore lookup:", repr(os.environ.get("VERSION_charset_normalizer")))
PYEOF
          docker run --rm \
            -v /tmp/probe.py:/tmp/probe.py:ro \
            -e VERSION_charset-normalizer=AAA \
            -e VERSION_charset_normalizer=BBB \
            -e VERSION_requests=CCC \
            --entrypoint python3 \
            kivy/buildozer:latest /tmp/probe.py
