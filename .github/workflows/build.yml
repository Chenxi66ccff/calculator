name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull buildozer image
        run: docker pull kivy/buildozer:latest

      # Stage 1：准备（下载 SDK/NDK、编译 python3 与 kivy），预期在纯 Python 安装处失败。
      - name: Stage 1 - prepare (expected failure)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/home/user/hostcwd" kivy/buildozer:latest android debug || true

      # 把补丁脚本挂载进容器后执行（不用 stdin 管道，避免容器 stdin 被 entrypoint 占用）。
      - name: Patch p4a requirements generation
        run: |
          base64 -d .github/patch_p4a3.b64 > "$GITHUB_WORKSPACE/patch_p4a3.py"
          docker run --rm             -v "$GITHUB_WORKSPACE:/home/user/hostcwd"             -v "$GITHUB_WORKSPACE/patch_p4a3.py:/tmp/patch_p4a3.py:ro"             --entrypoint python3             kivy/buildozer:latest /tmp/patch_p4a3.py
          echo "patch exit code: $?"

      - name: Verify patch applied
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/home/user/hostcwd"             --entrypoint python3             kivy/buildozer:latest -c "import pathlib; p=pathlib.Path('/home/user/hostcwd/.buildozer/android/platform/python-for-android/pythonforandroid/pythonpackage.py'); s=p.read_text(encoding='utf-8') if p.exists() else ''; print('pythonpackage.py exists:', p.exists()); print('has patch marker:', 'charset-normalizer' in s)"

      - name: Stage 2 - build APK
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/home/user/hostcwd" kivy/buildozer:latest android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: bin/*.apk
