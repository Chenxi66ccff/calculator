name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull buildozer image
        run: docker pull kivy/buildozer:latest

      # Stage 1: 让 buildozer 下载 SDK/NDK、编译 python3 与 kivy。
      # 它会在"安装纯 Python 模块"这一步失败 —— 这是预期的，因为那正是接下来要修的地方。
      - name: Stage 1 - prepare (expected to fail at pure-python install)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/home/user/hostcwd" kivy/buildozer:latest android debug || true

      # 修正 p4a 的 URL 处理缺陷。
      # p4a 用 pip --dry-run --report 解析依赖时把 Android 平台标记传给了 pip，
      # pip 据此为某些包伪造出并不存在的 wheel URL
      # （charset-normalizer 3.5.2 被写成 ...-cp314-cp314-android_24_arm64_v8a.whl），
      # p4a 再拿这个假 URL 安装，报 "is not a supported wheel on this platform"。
      # 补丁：若文件名不是本包装出来的 wheel，就退回用普通 PyPI 包 URL，让 pip 自行解析下载。
      - name: Patch p4a URL handling
        run: |
          base64 -d .github/patch_p4a.b64 > patch_p4a.py
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            --entrypoint python3 \
            kivy/buildozer:latest < patch_p4a.py

      - name: Stage 2 - build APK
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/home/user/hostcwd" kivy/buildozer:latest android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: bin/*.apk
