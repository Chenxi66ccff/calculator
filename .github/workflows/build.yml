name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull buildozer image
        run: docker pull kivy/buildozer:latest

      # Stage 1：准备（下载 SDK/NDK、编译 python3 与 kivy），
      # 预期在"安装纯 Python 模块"处失败。
      - name: Stage 1 - prepare (expected failure)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/home/user/hostcwd" kivy/buildozer:latest android debug || true

      # 修正 p4a 生成 requirements.txt 的地方：
      # pip --report 会依据 Android 平台标记伪造 wheel 文件名，
      # 该文件在 PyPI 上并不存在。补丁在写入前检查平台标签是否为 any，
      # 不是则退回普通 PyPI 包 URL，让 pip 自行解析正确版本。
      # 同时清除 .pyc 缓存，确保新代码生效。
      - name: Patch p4a requirements generation
        run: |
          base64 -d .github/patch_p4a3.b64 > patch_p4a3.py
          docker run --rm -i -v "$GITHUB_WORKSPACE:/home/user/hostcwd" --entrypoint python3 - kivy/buildozer:latest < patch_p4a3.py

      - name: Stage 2 - build APK
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/home/user/hostcwd" kivy/buildozer:latest android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: bin/*.apk
