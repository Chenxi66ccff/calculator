name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build debug APK (official buildozer Docker image)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            -e VERSION_charset-normalizer=3.4.4 \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -c '
              # p4a 在 run_pymodules_install 里支持用环境变量 VERSION_<模块名>
              # 覆盖模块版本（源码：os.environ.get(f"VERSION_{module}")）。
              #
              # 背景：p4a 自动解析纯 Python 依赖时会把 Android 平台标记传给 pip
              # （--platform=android_24_arm64_v8a --python-version=3.14），
              # pip 在 --report 里为 charset-normalizer 3.5.2 编造出一个并不存在的
              # 文件名 charset_normalizer-3.5.2-cp314-cp314-android_24_arm64_v8a.whl，
              # p4a 再拿这个假 URL 去安装，报 "is not a supported wheel on this platform"。
              # 本地实测：3.4.4 及更早版本会正常解析为 py3-none-any.whl。
              #
              # 同时把 p4a 自建的构建 venv 里的 pip 钉住，避免其升级到新版后行为漂移。
              printf "pip==25.3\n" > /home/user/constraints.txt
              export PIP_CONSTRAINT=/home/user/constraints.txt
              cd /home/user/hostcwd
              buildozer android debug
            '

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: bin/*.apk
