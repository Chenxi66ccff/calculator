name: Diag3
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/diag3.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe container
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/home/user/hostcwd" --entrypoint bash kivy/buildozer:latest /home/user/hostcwd/.github/probe.sh 2>&1 | tail -80
