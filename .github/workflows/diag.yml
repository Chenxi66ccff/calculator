name: Diagnostic - inspect build env

on:
  workflow_dispatch:

jobs:
  diag-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect official Docker image
        run: |
          echo "================ 1. buildozer 版本 ================"
          docker run --rm --entrypoint buildozer kivy/buildozer:latest --version || echo "(buildozer --version 失败)"
          echo
          echo "================ 2. 容器内 python 版本 ================"
          docker run --rm --entrypoint python3 kivy/buildozer:latest --version || true
          echo
          echo "================ 3. 容器内工作目录与默认入口 ================"
          docker run --rm --entrypoint pwd kivy/buildozer:latest || true
          docker inspect --format 'WORKDIR={{.Config.WorkingDir}} ENTRYPOINT={{.Config.Entrypoint}}' kivy/buildozer:latest
          echo
          echo "================ 4. 容器内是否有 pexpect ================"
          docker run --rm --entrypoint python3 kivy/buildozer:latest -c "import pexpect; print('pexpect OK', pexpect.__version__)" || echo "(无 pexpect)"
          echo
          echo "================ 5. 本地 spec 是否带新参数 ================"
          grep -n "accept_sdk_license" buildozer.spec || echo "(未找到 accept_sdk_license)"
          echo
          echo "================ 6. 容器内看到的 buildozer.spec（挂载后） ================"
          docker run --rm -v "$GITHUB_WORKSPACE:/home/user/hostcwd" --entrypoint bash kivy/buildozer:latest -c "ls -la /home/user/hostcwd/ | head -20; echo '---- spec 尾部 ----'; tail -8 /home/user/hostcwd/buildozer.spec"
          echo
          echo "================ 7. buildozer 源码中的 license 处理 ================"
          docker run --rm --entrypoint bash kivy/buildozer:latest -c "python3 -c \"import buildozer, os; p=os.path.dirname(buildozer.__file__); print('buildozer 装在:', p)\"; grep -n 'accept_sdk_license' -r /home/user/.venv/lib/*/site-packages/buildozer/ 2>/dev/null || grep -rn 'accept_sdk_license' \$(python3 -c \"import buildozer,os;print(os.path.dirname(buildozer.__file__))\") || echo '(源码中找不到 accept_sdk_license)')"

  diag-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install buildozer + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer "cython<3" pexpect

      - name: Show spec and licenses handling
        run: |
          echo "================ spec 尾部 ================"
          tail -8 buildozer.spec
          echo
          echo "================ buildozer 版本 ================"
          buildozer --version
          echo
          echo "================ 尝试接受 license ================"
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "(先建目录，等 buildozer 下载 SDK 后再接受)"

      - name: Run buildozer (10 min cap) to see license behaviour
        run: |
          timeout 600 buildozer android debug 2>&1 | tail -60 || echo "=== buildozer 被截断/失败（这是预期的诊断） ==="
          echo
          echo "================ 结束后 licenses 目录内容 ================"
          find ~/.buildozer/android/platform/android-sdk/licenses -type f 2>/dev/null | head
          ls -la ~/.buildozer/android/platform/android-sdk/ 2>/dev/null | head
